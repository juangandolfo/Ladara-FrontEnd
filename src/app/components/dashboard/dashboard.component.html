<div class="home-container">
  <header class="sticky-header">
    <button class="logo logo-button" type="button" (click)="goHome()" aria-label="Ir al inicio">
      <img src="assets/images/logo.png" alt="" class="logo-image">
      <span>Ladara</span>
    </button>

    <div class="header-actions">
      <button class="btn btn-secondary" *ngIf="!isLoggedIn()" type="button" (click)="login()">
        <span class="btn-icon login-icon" aria-hidden="true"></span>
        Inicia sesión
      </button>

      <button class="btn btn-ghost" *ngIf="isLoggedIn()" type="button" (click)="logout()">
        <span class="btn-icon logout-icon" aria-hidden="true"></span>
        Cerrar sesión
      </button>

      <button class="btn btn-ghost" *ngIf="isLoggedIn()" type="button" (click)="goToOrders()">
        <span class="btn-icon orders-icon" aria-hidden="true"></span>
        Mis Órdenes
      </button>

      <button class="btn btn-primary" *ngIf="isLoggedIn()" type="button" (click)="goToCart()" aria-label="Ver Carrito">
        <span class="btn-icon btn-icon-dark cart-icon" aria-hidden="true"></span>
        <span>Carrito</span>
      </button>
    </div>
  </header>

  <main class="dashboard-content" aria-labelledby="dashboard-title">
    <h2 class="dashboard-title" id="dashboard-title">Resumen de pedidos</h2>

    <div class="dashboard-loading" *ngIf="isLoading" role="status" aria-live="polite" aria-busy="true">
      Cargando indicadores de pedidos...
    </div>

    <section class="dashboard-error" *ngIf="error && !isLoading" role="alert" aria-labelledby="dashboard-error-title">
      <h3 id="dashboard-error-title">No pudimos cargar los indicadores</h3>
      <p>{{ error }}</p>
      <button class="btn btn-secondary" type="button" (click)="loadSummary()">Reintentar</button>
    </section>

    <section class="metrics-grid" *ngIf="summary && !isLoading" aria-label="Indicadores de pedidos" aria-live="polite">
      <article class="metric-card" *ngFor="let metric of metrics; trackBy: trackByMetricLabel">
        <h3>{{ metric.label }}</h3>
        <p class="metric-value">{{ metric.value | number }}</p>
      </article>
    </section>
  </main>
</div>
